<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Shop</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="css/styles.css" rel="stylesheet" />
        <script type="module" src="src/index.js"></script>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-sm bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>
                    <button
                        class="btn btn-outline-secondary ms-auto me-2 order-sm-last"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#cartSidebar"
                        aria-controls="cartSidebar"
                        aria-label="Abrir carrito"
                    >
                        <i class="bi bi-cart3" aria-hidden="true"></i>
                    </button>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-label="Abrir menú"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div
                        class="offcanvas offcanvas-end"
                        tabindex="-1"
                        id="navbarNav"
                        aria-labelledby="navbarNavLabel"
                    >
                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title" id="navbarNavLabel">
                                Menu
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="offcanvas"
                                aria-label="Cerrar menú"
                            ></button>
                        </div>
                        <div class="offcanvas-body">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a
                                        class="nav-link active"
                                        aria-current="page"
                                        href="#"
                                        >Home</a
                                    >
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">Features</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">Pricing</a>
                                </li>
                                <li class="nav-item">
                                    <a
                                        class="nav-link disabled"
                                        aria-disabled="true"
                                        >Disabled</a
                                    >
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <h1>Hello, world!</h1>
            <section aria-labelledby="productos-titulo">
                <h2 id="productos-titulo" class="h4">Productos</h2>
                <div class="card" style="width: 18rem" id="product-list">
                    <!-- Desde JS -->
                </div>
            </section>
        </main>

        <aside
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="cartSidebar"
            aria-labelledby="cartSidebarLabel"
        >
            <div class="offcanvas-header">
                <h2 class="offcanvas-title h5" id="cartSidebarLabel">
                    Carrito
                </h2>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar carrito"
                ></button>
            </div>
            <div class="offcanvas-body" id="cart-items">
                <p class="text-body-secondary">Tu carrito está vacío.</p>
            </div>
        </aside>

        <footer class="bg-body-tertiary py-3 mt-auto">
            <div class="container text-center">
                <small>&copy; 2026 FAKE-SHOP</small>
            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    </body>
</html>
