<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FAKE-SHOP</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="css/styles.css" rel="stylesheet" />
        <script type="module" src="src/index.js"></script>
    </head>
    <body>
        <header class="sticky-top">
            <nav class="navbar bg-body-tertiary" aria-label="Principal">
                <div class="container gap-3 flex-wrap">
                    <a class="navbar-brand fw-bold logo" href="#">
                        <i class="bi bi-bag-heart-fill" aria-hidden="true"></i>
                        FAKE-SHOP
                    </a>
                    <form
                        class="buscador order-last order-md-0 flex-grow-1"
                        role="search"
                    >
                        <label for="search-input" class="visually-hidden"
                            >Buscar productos</label
                        >
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-search" aria-hidden="true"></i>
                            </span>
                            <input
                                type="search"
                                class="form-control"
                                id="search-input"
                                placeholder="Buscar productos..."
                            />
                        </div>
                    </form>
                    <button
                        class="btn btn-outline-secondary position-relative"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#cartSidebar"
                        aria-controls="cartSidebar"
                    >
                        <i class="bi bi-cart3" aria-hidden="true"></i>
                        <span class="visually-hidden">Abrir carrito</span>
                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        >
                            <span id="cart-count">0</span>
                            <span class="visually-hidden">productos</span>
                        </span>
                    </button>
                </div>
            </nav>
            <nav class="nav-categorias" aria-label="Categorías">
                <div class="container">
                    <ul
                        class="nav nav-pills flex-nowrap overflow-auto py-2 gap-2"
                    >
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="#"
                                data-categoria="todas"
                                >Todas</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#"
                                data-categoria="electronica"
                                >Electrónica</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-categoria="ropa"
                                >Ropa</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#"
                                data-categoria="deportes"
                                >Deportes</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-categoria="hogar"
                                >Hogar</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#"
                                data-categoria="muebles"
                                >Muebles</a
                            >
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <!-- <h1>Hello, world!</h1> -->
            <section aria-labelledby="productos-titulo">
                <h2 id="productos-titulo" class="h4">Productos</h2>
                <div class="row g-4" id="product-list">
                    <!-- Desde JS -->
                </div>
            </section>
        </main>

        <aside
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="cartSidebar"
            aria-labelledby="cartSidebarLabel"
        >
            <div class="offcanvas-header">
                <h2 class="offcanvas-title h5" id="cartSidebarLabel">
                    Carrito
                </h2>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar carrito"
                ></button>
            </div>
            <div class="offcanvas-body" id="cart-items">
                <!-- Lo cargamos desde JS -->
            </div>
        </aside>

        <footer class="bg-body-tertiary py-3 mt-auto">
            <div class="container text-center">
                <small>&copy; 2026 FAKE-SHOP</small>
            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    </body>
</html>
